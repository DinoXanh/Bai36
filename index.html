<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
}

.container{
    width:90%;
    max-width:1000px;
}

h1{
    color:white;
    text-align:center;
    font-size:45px;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    text-align:center;
    margin-bottom:40px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    border-radius:18px;
    padding:35px 20px;
    text-align:center;
    transition:.35s;
    box-shadow:0 15px 30px rgba(0,0,0,.35);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    background:#2563eb;
    box-shadow:0 0 25px #3b82f6;
}

.icon{
    font-size:55px;
    margin-bottom:15px;
}

.card h2{
    margin-bottom:10px;
}

.card span{
    color:#dbeafe;
    font-size:15px;
}

footer{
    color:#94a3b8;
    text-align:center;
    margin-top:40px;
}
</style>

</head>
